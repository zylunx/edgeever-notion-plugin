name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            RANGE="HEAD"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
          fi

          {
            echo "## EdgeEver <-> Notion Sync v${VERSION}"
            echo ""
            echo "在 EdgeEver 插件市场输入仓库地址安装，或下载本 Release 的 manifest.json、main.js、styles.css。"
            echo ""
            echo "### 更新内容"
            echo ""
            section() {
              local title="$1"; shift
              local log
              log=$(git log $RANGE --pretty=format:"- %s (%h)" "$@" 2>/dev/null)
              if [ -n "$log" ]; then
                echo "#### ${title}"
                echo ""
                echo "$log"
                echo ""
              fi
            }
            section "✨ 新功能" --grep="^feat" -i
            section "🐛 问题修复" --grep="^fix" -i
            section "📝 文档" --grep="^docs" -i
            section "🔧 其他变更" --grep="^feat" -i --grep="^fix" -i --grep="^docs" -i --invert-grep
            echo "**完整更新日志**：${COMPARE_URL}"
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing assets and notes."
            gh release upload "$TAG" manifest.json main.js styles.css --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            echo "Creating release $TAG."
            gh release create "$TAG" manifest.json main.js styles.css \
              --title "EdgeEver <-> Notion Sync v${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
